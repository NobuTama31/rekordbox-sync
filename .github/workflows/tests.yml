name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # The full suite, including the PowerShell protocol tests that
    # only run on Windows and the Node overlay harness.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install ruff
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        # Plain run on purpose — no PYTHONUTF8: the suite must pass
        # under the platform's default encoding (audit stage 1).
        run: python -m unittest discover -s tests

  ubuntu:
    # The platform-independent suite; Windows-only tests skip here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
      - name: Test
        run: python -m unittest discover -s tests
